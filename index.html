<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ef"><title>สองฝั่ง · photo booth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
:root{--ink:#202020;--muted:#827e7a;--paper:#f6f3ef;--accent:#f17356;--line:#e7e1da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans Thai',sans-serif;min-height:100dvh}button,select{font:inherit}button{cursor:pointer}.shell{max-width:520px;margin:0 auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:5px 0 28px}.brand{font-weight:800;letter-spacing:-.6px;font-size:18px}.brand i{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:50%;margin:0 4px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;font-size:18px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:7px}.title{font-size:34px;line-height:1.1;letter-spacing:-1.4px;margin:0 0 7px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin:0 0 23px}.settings{display:flex;gap:8px;align-items:center;margin-bottom:14px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;color:#555;font-size:12px}.pill.active{background:#242323;color:white;border-color:#242323}.spacer{flex:1}.frame{border-radius:19px;background:#242323;padding:7px;box-shadow:0 16px 32px #3d32221a;position:relative;overflow:hidden}.grid{display:grid;gap:6px;height:66.667vw;min-height:220px;max-height:320px;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:row}.cell{background:#514e4a;border:1px solid #706a63;border-radius:9px;overflow:hidden;position:relative;display:grid;place-items:center;color:#f7f3ed}.cell img{width:100%;height:100%;object-fit:cover}.cell .empty{font-size:12px;opacity:.88;text-align:center;padding:6px;line-height:1.6}.cell .empty b{font-size:22px;font-weight:400}.cell .empty small{display:block;font-size:9px;opacity:.75}.cell .num{position:absolute;top:7px;left:7px;border-radius:50%;background:#242323c9;width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:700}.cell .who{position:absolute;bottom:6px;left:7px;font-size:9px;background:#242323a8;padding:3px 6px;border-radius:8px}.framehint{color:#d3d0cc;display:flex;justify-content:space-between;font-size:10px;padding:9px 5px 3px}.actions{display:flex;align-items:center;gap:10px;margin-top:15px}.primary{border:0;background:#242323;color:white;font-size:15px;font-weight:700;border-radius:14px;padding:15px 20px;flex:1;box-shadow:0 5px 0 #d8d1c9}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #d8d1c9}.secondary{border:1px solid var(--line);background:white;border-radius:14px;padding:14px 16px;color:#333}.smallnote{text-align:center;color:#9a948d;font-size:10px;margin:18px 0 5px}.preview{position:fixed;inset:0;background:#111e;display:none;align-items:center;justify-content:center;padding:22px;z-index:4}.preview.show{display:flex}.previewbox{width:min(100%,500px);background:var(--paper);padding:12px;border-radius:20px}.previewbox img{display:block;width:100%;border-radius:12px}.previewbar{display:flex;gap:8px;margin-top:10px}.previewbar button{flex:1}.overlay{position:fixed;inset:0;background:#101010bd;z-index:5;display:none;align-items:center;justify-content:center;color:white;font-size:72px;font-weight:800}.overlay.show{display:flex}.overlay small{display:block;font-size:13px;letter-spacing:2px;text-align:center}.tip{padding:12px 14px;background:#eee9e3;border-radius:12px;font-size:11px;color:#716b64;margin-top:16px;line-height:1.55}.file{display:none}
</style></head><body><main class="shell"><header class="top"><div class="brand">together<i></i>frame</div><button class="iconbtn" aria-label="สลับกล้อง" id="flip">↻</button></header><div class="eyebrow">little moments, together</div><h1 class="title">ถ่ายรูปด้วยกัน</h1><p class="sub">สลับกันถ่ายทีละรูป แล้วเก็บเป็นภาพเดียวกันไว้</p><div class="settings"><button class="pill active" data-count="4">4 รูป</button><button class="pill" data-count="6">6 รูป</button><button class="pill" data-count="8">8 รูป</button><span style="flex:1"></span><select class="pill" id="timer" aria-label="เวลานับถอยหลัง"><option value="3">3 วิ</option><option value="5" selected>5 วิ</option><option value="10">10 วิ</option></select></div><section class="frame"><div class="grid" id="grid"></div><div class="framehint"><span id="turn">พร้อมเริ่มถ่าย</span><span id="counter">0 / 4</span></div></section><div class="tip" id="tip">เริ่มจากคนหนึ่งถ่ายก่อน จากนั้นส่งมือถือให้อีกคนถ่ายต่อสลับกันไป เว็บนี้บันทึกภาพไว้ในเครื่องที่ใช้ถ่าย</div><div class="spacer"></div><div class="actions"><button class="secondary" id="reset">เริ่มใหม่</button><button class="primary" id="start">เริ่มถ่ายรูป&nbsp; →</button></div><p class="smallnote">ภาพคู่ของเรา · เก็บไว้เป็นความทรงจำ</p><input type="file" class="file" id="upload" accept="image/*" capture="user"></main><div class="overlay" id="countdown"><div><span id="countNum">3</span><small>ยิ้มให้กันนะ</small></div></div><div class="preview" id="preview"><div class="previewbox"><img id="result"><div class="previewbar"><button class="secondary" id="close">ปิด</button><button class="primary" id="download">บันทึกรูปภาพ</button></div></div></div><script>
const grid=document.querySelector('#grid'),upload=document.querySelector('#upload'),tip=document.querySelector('#tip');let total=4,shots=[],active=0,facing='user';function draw(){grid.style.gridTemplateColumns='repeat(2,1fr)';grid.innerHTML='';for(let i=0;i<total;i++){let c=document.createElement('div');c.className='cell';c.onclick=()=>{if(!shots[i]&&i===shots.length)document.querySelector('#start').click()};if(shots[i])c.innerHTML=`<img src="${shots[i].url}"><span class="num">${i+1}</span><span class="who">${i%2?'อีกคน':'คนที่ 1'}</span>`;else c.innerHTML=`<span class="empty"><b>＋</b><br>รูปที่ ${i+1}<small>แตะเพื่อถ่าย</small></span>`;grid.append(c)}document.querySelector('#counter').textContent=`${shots.length} / ${total}`;document.querySelector('#turn').textContent=shots.length===total?'ครบแล้ว! กดบันทึกได้เลย':shots.length?`ตาของ${shots.length%2?'อีกคน':'คนที่ 1'}ถ่าย`:'พร้อมเริ่มถ่าย';document.querySelector('#start').textContent=shots.length===total?'ดูภาพรวม  →':shots.length?'ถ่ายรูปถัดไป  →':'เริ่มถ่ายรูป  →';document.querySelector('#start').disabled=false}
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{if(shots.length)return;total=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelector('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';tip.textContent='กล้องจะใช้มุม '+(facing==='user'?'ด้านหน้า':'ด้านหลัง')+' ในภาพถัดไป'};document.querySelector('#reset').onclick=()=>{shots.forEach(s=>URL.revokeObjectURL(s.url));shots=[];draw()};document.querySelector('#start').onclick=()=>{if(shots.length===total){makeResult();return}active=shots.length;let n=+document.querySelector('#timer').value,ov=document.querySelector('#countdown');ov.classList.add('show');document.querySelector('#countNum').textContent=n;let t=setInterval(()=>{n--;document.querySelector('#countNum').textContent=n||'📸';if(n<=0){clearInterval(t);setTimeout(()=>{ov.classList.remove('show');upload.click()},400)}},1000)};upload.onchange=()=>{let f=upload.files[0];if(f){shots.push({url:URL.createObjectURL(f),file:f});draw()}upload.value=''};function makeResult(){let urls=shots.map(x=>x.url),imgs=[];urls.forEach((u,i)=>{let im=new Image;im.onload=()=>{imgs[i]=im;if(imgs.filter(Boolean).length===urls.length){let c=document.createElement('canvas'),ctx=c.getContext('2d'),cols=2,rows=Math.ceil(total/2),w=1000,h=Math.round(w/1.5),gap=14,cellw=(w-gap*(cols+1))/cols,cellh=(h-gap*(rows+1))/rows;c.width=w;c.height=h;ctx.fillStyle='#272523';ctx.fillRect(0,0,w,h);imgs.forEach((img,j)=>{let x=gap+(j%2)*(cellw+gap),y=gap+Math.floor(j/2)*(cellh+gap),scale=Math.max(cellw/img.width,cellh/img.height),sw=cellw/scale,sh=cellh/scale;ctx.save();ctx.beginPath();ctx.roundRect(x,y,cellw,cellh,15);ctx.clip();ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,cellw,cellh);ctx.restore()});document.querySelector('#result').src=c.toDataURL('image/jpeg',.92);document.querySelector('#preview').classList.add('show');document.querySelector('#download').onclick=()=>{let a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.92);a.download='together-frame.jpg';a.click()}}};im.src=u})}document.querySelector('#close').onclick=()=>document.querySelector('#preview').classList.remove('show');draw();
</script></body></html>
